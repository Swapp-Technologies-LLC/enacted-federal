  - transition_period: "Between October 30, 2024, and November 1, 2027"
    quote: "Between October 30, 2024, and November 1, 2027, community water systems and non-transient non-community water systems must comply with 40 CFR 141.2, 141.31(d), and 141.80 through 141.91, as codified on July 1, 2020, except systems must also comply with 40 CFR 141.84(a)(1) through (10) (excluding paragraphs (a)(6) and (7)), 141.85(a)(1)(ii) and (e), 141.90(e)(1) and (13), (f)(4), and (h)(3), 141.201(a)(3)(vi) and (c)(3), and 141.202(a)(10); 40 CFR part 141, appendix A to subpart Q, entry I.C.1 (excluding § 141.90, except paragraphs (e)(1) and (13) and (f)(4)) and entry I.C.2; 40 CFR part 141, appendix B to subpart Q, entry D.23; and 40 CFR 141.31(d)(2), as codified on July 1, 2024."
