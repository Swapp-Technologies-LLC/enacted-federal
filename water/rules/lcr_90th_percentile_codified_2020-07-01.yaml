copper:
  quote: "The copper action level is exceeded if the concentration of copper in more than 10 percent of tap water samples collected during any monitoring period conducted in accordance with § 141.86 is greater than 1.3 mg/L (i.e., if the ‘‘90th percentile’’ copper level is greater than 1.3 mg/L)."
  citation: "40 CFR § 141.80(c)(2)"
  source_page: 126
applies_by:
