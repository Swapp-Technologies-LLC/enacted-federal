    quote: "Between December 16, 2021, and October 16, 2024, community water systems and non-transient, non-community water systems must comply with 40 CFR 141.80 through 141.91, as codified on July 1, 2020."
    citation: "40 CFR § 141.80(a)(4)(i) (2023 edition)"
    source_sha256: "d08daa941f5b0297ff943312da1916efc4b408cc3cf9f4fc158830639cddb5bb"
