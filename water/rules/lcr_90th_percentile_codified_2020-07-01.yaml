quote: "The lead action level is exceeded if the concentration of lead in more than 10 percent of tap water samples collected during any monitoring period conducted in accordance with § 141.86 is greater than 0.015 mg/L (i.e., if the ‘‘90th percentile’’ lead level is greater than 0.015 mg/L)."
citation: "40 CFR § 141.80(c)(1)"
edition: "as codified on July 1, 2020"
source_url: "https://www.govinfo.gov/content/pkg/CFR-2020-title40-vol25/pdf/CFR-2020-title40-vol25-part141.pdf"
